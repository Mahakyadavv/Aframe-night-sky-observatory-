<!DOCTYPE html>
<html>
  <head>
    <title>VR Night Sky Observatory</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets></a-assets>

      <a-entity environment="preset: starry; groundColor: #050505; grid: cross; gridColor: #222"></a-entity>

      <a-entity camera look-controls position="0 1.6 0">
        <a-entity cursor="fuse: true; fuseTimeout: 1000"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: #FF0000; shader: flat">
          <a-animation begin="fusing" easing="ease-in" attribute="scale" fill="forwards" from="1 1 1" to="0.1 0.1 0.1" dur="1000"></a-animation>
        </a-entity>
      </a-entity>

      <a-entity id="constellation" position="0 0 -5">
        
        <a-sphere class="star" position="-1.5 3 -2" radius="0.15" color="white" 
                  material="emissive: #FFF; emissiveIntensity: 2">
        </a-sphere>

        <a-sphere class="star" position="0 4 -3" radius="0.15" color="white"
                  material="emissive: #FFF; emissiveIntensity: 2">
        </a-sphere>

        <a-sphere class="star" position="1.5 3 -2" radius="0.15" color="white"
                  material="emissive: #FFF; emissiveIntensity: 2">
        </a-sphere>

        <a-entity id="line-container">
            <a-entity id="line1" line="start: -1.5 3 -2; end: 0 4 -3; color: yellow; visible: false"></a-entity>
            <a-entity id="line2" line="start: 0 4 -3; end: 1.5 3 -2; color: yellow; visible: false"></a-entity>
        </a-entity>
      </a-entity>

      <a-text value="Look at the stars to connect them!" position="-2 0.5 -3" color="white" width="4"></a-text>

      <script>
        // Sare stars ko select karo
        const stars = document.querySelectorAll('.star');
        const line1 = document.querySelector('#line1');
        const line2 = document.querySelector('#line2');

        stars.forEach(star => {
          // 'click' trigger hota hai jab cursor fuse hota hai (1 second dekhne par)
          star.addEventListener('click', function () {
            console.log("Star Clicked!"); // Console mein check karne ke liye
            this.setAttribute('color', 'yellow');
            this.setAttribute('scale', '1.5 1.5 1.5');
            
            // Dono lines ko visible kar do
            line1.setAttribute('line', 'visible', true);
            line2.setAttribute('line__2', 'visible', true); // Note: line__2 is for multiple lines on one entity, but here we used separate entities for safety
            line2.setAttribute('line', 'visible', true);
          });
        });
      </script>

      <a-light type="ambient" color="#444"></a-light>
    </a-scene>
  </body>
</html>
