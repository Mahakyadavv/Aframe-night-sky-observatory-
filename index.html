<!DOCTYPE html>
<html>
  <head>
    <title>Twinkling Star Observatory</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity environment="preset: starry; ground: none; fog: 0"></a-entity>

      <a-entity camera look-controls position="0 1.6 0">
        <a-entity cursor="fuse: true; fuseTimeout: 1000"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: #00FF00; shader: flat">
        </a-entity>
      </a-entity>

      <a-entity id="star-cluster" position="0 2 -6">
        
        <a-octahedron class="star" position="-2 1.5 0" radius="0.15" color="#FFF"
                      material="emissive: #FFF; emissiveIntensity: 2"
                      animation="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dir: alternate; dur: 1000; loop: true">
        </a-octahedron>

        <a-octahedron class="star" position="0 3 -1" radius="0.15" color="#FFF"
                      material="emissive: #FFF; emissiveIntensity: 2"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"
                      animation__twinkle="property: scale; from: 0.8 0.8 0.8; to: 1.2 1.2 1.2; dir: alternate; dur: 1500; loop: true">
        </a-octahedron>

        <a-octahedron class="star" position="2 1.5 0" radius="0.15" color="#FFF"
                      material="emissive: #FFF; emissiveIntensity: 2"
                      animation="property: scale; from: 1 1 1; to: 1.4 1.4 1.4; dir: alternate; dur: 1200; loop: true">
        </a-octahedron>

        <a-entity id="constellation-lines" 
                  line="start: -2 1.5 0; end: 0 3 -1; color: #00FFFF; visible: false"
                  line__2="start: 0 3 -1; end: 2 1.5 0; color: #00FFFF; visible: false">
        </a-entity>
      </a-entity>

      <a-text value="Stars chamak rahe hain! Inhe dekho..." position="-1.5 0.5 -3" color="yellow" width="4"></a-text>

      <script>
        const stars = document.querySelectorAll('.star');
        const lines = document.querySelector('#constellation-lines');

        stars.forEach(star => {
          star.addEventListener('click', function () {
            // Interaction: Star orange ho jayega aur line dikhegi
            this.setAttribute('color', '#FFA500');
            lines.setAttribute('line', 'visible', true);
            lines.setAttribute('line__2', 'visible', true);
          });
        });
      </script>

    </a-scene>
  </body>
</html>
