<!DOCTYPE html>
<html>
  <head>
    <title>Pentagram Constellation VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity id="sky" environment="preset: starry; ground: none; skyType: color; skyColor: #000; stars: 0"></a-entity>

      <a-entity camera look-controls position="0 1.6 0">
        <a-entity cursor="fuse: true; fuseTimeout: 1000"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: #00FF00; shader: flat">
        </a-entity>
      </a-entity>

      <a-text id="status-text" value="PROTOCOL: LOCATE THE NODES" position="-1.5 0.5 -3" color="#00FFFF" width="4"></a-text>

      <a-entity id="pentagram-group" position="0 2.5 -5">
        
        <a-octahedron class="star-node" position="0 1.5 0" radius="0.15" color="white"></a-octahedron>
        <a-octahedron class="star-node" position="1.4 0.5 0" radius="0.15" color="white"></a-octahedron>
        <a-octahedron class="star-node" position="0.9 -1 0" radius="0.15" color="white"></a-octahedron>
        <a-octahedron class="star-node" position="-0.9 -1 0" radius="0.15" color="white"></a-octahedron>
        <a-octahedron class="star-node" position="-1.4 0.5 0" radius="0.15" color="white"></a-octahedron>

        <a-entity id="star-lines" visible="false">
          <a-entity line="start: 0 1.5 0; end: 0.9 -1 0; color: #FFD700"></a-entity>
          <a-entity line="start: 0.9 -1 0; end: -1.4 0.5 0; color: #FFD700"></a-entity>
          <a-entity line="start: -1.4 0.5 0; end: 1.4 0.5 0; color: #FFD700"></a-entity>
          <a-entity line="start: 1.4 0.5 0; end: -0.9 -1 0; color: #FFD700"></a-entity>
          <a-entity line="start: -0.9 -1 0; end: 0 1.5 0; color: #FFD700"></a-entity>
        </a-entity>
      </a-entity>

      <script>
        const nodes = document.querySelectorAll('.star-node');
        const lines = document.querySelector('#star-lines');
        const statusText = document.querySelector('#status-text');
        const sky = document.querySelector('#sky');

        nodes.forEach(node => {
          // A. Cursor Move (Hover) -> Size Change
          node.addEventListener('mouseenter', function () {
            this.setAttribute('animation', 'property: scale; to: 2.5 2.5 2.5; dur: 200');
            statusText.setAttribute('value', 'ANALYZING STAR COORDINATES...');
            statusText.setAttribute('color', '#FF00FF');
          });

          node.addEventListener('mouseleave', function () {
            this.setAttribute('animation', 'property: scale; to: 1 1 1; dur: 200');
            statusText.setAttribute('value', 'PROTOCOL: LOCATE THE NODES');
            statusText.setAttribute('color', '#00FFFF');
          });

          // B. Click (Gaze) -> Glow, Lines, and Background Stars Reveal
          node.addEventListener('click', function () {
            // Glow effect on nodes
            nodes.forEach(n => {
              n.setAttribute('material', 'emissive: #00FF00; emissiveIntensity: 10');
              n.setAttribute('color', '#00FF00');
            });

            // Show constellation
            lines.setAttribute('visible', 'true');

            // Reveal background stars and change sky
            sky.setAttribute('environment', 'stars: 5000; skyColor: #020205');
            
            // Final Text update
            statusText.setAttribute('value', 'CONSTELLATION UNLOCKED: PENTAGRAM');
            statusText.setAttribute('color', '#00FF00');
          });
        });
      </script>
    </a-scene>
  </body>
</html>
