<!DOCTYPE html>
<html>
  <head>
    <title>Interactive VR Night Sky</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity environment="preset: starry; ground: none; fog: 0"></a-entity>

      <a-entity camera look-controls position="0 1.6 0">
        <a-entity cursor="fuse: true; fuseTimeout: 800"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: #00FF00; shader: flat"
                  animation__fusing="property: scale; from: 1 1 1; to: 0.1 0.1 0.1; startEvents: fusing; dur: 800"
                  animation__mouseleave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 100">
        </a-entity>
      </a-entity>

      <a-entity position="0 2 -5">
        
        <a-octahedron class="star" position="-2 1 0" radius="0.15" color="yellow"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-octahedron>

        <a-sphere class="star" position="0 2 0" radius="0.15" color="white"
                  material="emissive: #FFF; emissiveIntensity: 2">
        </a-sphere>

        <a-sphere class="star" position="2 1 0" radius="0.15" color="white"
                  material="emissive: #FFF; emissiveIntensity: 2">
        </a-sphere>

        <a-entity id="sky-line" 
                  line="start: -2 1 0; end: 0 2 0; color: #00FFFF; visible: false"
                  line__2="start: 0 2 0; end: 2 1 0; color: #00FFFF; visible: false">
        </a-entity>
      </a-entity>

      <a-text value="Cursor ko star par roko!" position="-1.5 0.5 -3" color="lime"></a-text>

      <script>
        const stars = document.querySelectorAll('.star');
        const lines = document.querySelector('#sky-line');

        stars.forEach(star => {
          // Jab cursor star par 800ms tak rukega
          star.addEventListener('click', function () {
            // Movement/Interaction dikhane ke liye changes:
            this.setAttribute('color', 'orange');
            this.setAttribute('scale', '2 2 2'); // Star bada ho jayega
            lines.setAttribute('line', 'visible', true);
            lines.setAttribute('line__2', 'visible', true);
            console.log("Interaction Successful!");
          });
        });
      </script>

    </a-scene>
  </body>
</html>
