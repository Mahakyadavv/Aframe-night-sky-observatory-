<!DOCTYPE html>
<html>
  <head>
    <title>Pentagram Constellation VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity environment="preset: starry; ground: none; fog: 0"></a-entity>

      <a-entity camera look-controls position="0 1.6 0">
        <a-entity cursor="fuse: true; fuseTimeout: 1000"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: #00FF00; shader: flat">
        </a-entity>
      </a-entity>

      <a-text id="guide-text" 
              value="SYSTEM READY: EXPLORE THE STARS" 
              position="-2 0.5 -3" 
              color="#00FFFF" 
              width="4"
              font="exo2bold">
      </a-text>

      <a-entity id="pentagram" position="0 2.5 -5">
        <a-octahedron class="clickable-star" position="0 1.5 0" radius="0.12" color="white" material="emissive: #FFF; emissiveIntensity: 1"></a-octahedron>
        <a-octahedron class="clickable-star" position="1.4 0.5 0" radius="0.12" color="white" material="emissive: #FFF; emissiveIntensity: 1"></a-octahedron>
        <a-octahedron class="clickable-star" position="0.9 -1 0" radius="0.12" color="white" material="emissive: #FFF; emissiveIntensity: 1"></a-octahedron>
        <a-octahedron class="clickable-star" position="-0.9 -1 0" radius="0.12" color="white" material="emissive: #FFF; emissiveIntensity: 1"></a-octahedron>
        <a-octahedron class="clickable-star" position="-1.4 0.5 0" radius="0.12" color="white" material="emissive: #FFF; emissiveIntensity: 1"></a-octahedron>

        <a-entity id="lines" visible="false">
          <a-entity line="start: 0 1.5 0; end: 0.9 -1 0; color: #FFD700"></a-entity>
          <a-entity line="start: 0.9 -1 0; end: -1.4 0.5 0; color: #FFD700"></a-entity>
          <a-entity line="start: -1.4 0.5 0; end: 1.4 0.5 0; color: #FFD700"></a-entity>
          <a-entity line="start: 1.4 0.5 0; end: -0.9 -1 0; color: #FFD700"></a-entity>
          <a-entity line="start: -0.9 -1 0; end: 0 1.5 0; color: #FFD700"></a-entity>
        </a-entity>
      </a-entity>

      <script>
        const stars = document.querySelectorAll('.clickable-star');
        const linesContainer = document.querySelector('#lines');
        const infoText = document.querySelector('#guide-text');

        stars.forEach(star => {
          // Hover logic
          star.addEventListener('mouseenter', function () {
            this.setAttribute('animation', { property: 'scale', to: '2.5 2.5 2.5', dur: 300 });
            infoText.setAttribute('value', 'ANOMALY DETECTED: SCALING STAR...');
            infoText.setAttribute('color', '#FFCC00');
          });

          star.addEventListener('mouseleave', function () {
            this.setAttribute('animation', { property: 'scale', to: '1 1 1', dur: 300 });
            infoText.setAttribute('value', 'SEARCHING FOR CONSTELLATION...');
            infoText.setAttribute('color', '#00FFFF');
          });

          // Click/Gaze logic
          star.addEventListener('click', function () {
            this.setAttribute('material', 'emissiveIntensity', 15);
            this.setAttribute('color', '#FFD700'); 
            linesContainer.setAttribute('visible', 'true');
            
            // Text update on success
